<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Vercel 嘅 serverless runtime 冇裝任何中文字型，sharp 用 SVG 燒中文字（副圖卡/文字疊圖）
  會因為 fontconfig 揾唔到對應字型而變成 tofu box（囗囗囗）。呢個檔案令 fontconfig 揾到
  同目錄嘅 Noto Sans TC（開源 OFL 授權），並將程式碼裡面寫嘅系統字型名（PingFang TC 等，
  本機 Mac 有裝、Vercel 冇裝）全部 alias 去呢個字。
  <dir> 用相對路徑，fontconfig 會用「呢個 conf 檔自己所在嘅目錄」做基準，唔使理會實際部署路徑。
-->
<fontconfig>
  <dir>.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans TC</family></prefer>
  </alias>
  <alias><family>PingFang TC</family><accept><family>Noto Sans TC</family></accept></alias>
  <alias><family>PingFang SC</family><accept><family>Noto Sans TC</family></accept></alias>
  <alias><family>Microsoft JhengHei</family><accept><family>Noto Sans TC</family></accept></alias>
  <alias><family>Microsoft YaHei</family><accept><family>Noto Sans TC</family></accept></alias>
  <alias><family>Heiti TC</family><accept><family>Noto Sans TC</family></accept></alias>
  <alias><family>Noto Sans CJK TC</family><accept><family>Noto Sans TC</family></accept></alias>
</fontconfig>
